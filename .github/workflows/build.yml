name: Build, Test, and Deploy

on:
  push:
    branches: "**"
    tags-ignore: ["**"]
  pull_request:

jobs:
  call-build:
    uses: KyoriPowered/.github/.github/workflows/shared-ci.yaml@trunk
    with:
      publish_releases: true
      gradle_release_publish_tasks: "publish publishPlugins"
    permissions:
      actions: "write"
      contents: "write"
      id-token: "write"
    secrets: inherit
